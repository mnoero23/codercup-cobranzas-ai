[theme]
base = "light"
primaryColor = "#6D5CE7"
backgroundColor = "#F3F6F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B35"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
borderColor = "#D7E0E3"
dataframeBorderColor = "#D7E0E3"
dataframeHeaderBackgroundColor = "#E8EEF0"
chartCategoricalColors = ["#4F46E5", "#8B5CF6", "#F59E0B", "#E76F51", "#64748B"]
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 14
headingFontSizes = ["2rem", "1.35rem", "1.05rem", "0.95rem", "0.85rem", "0.75rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
linkUnderline = false
blueColor = "#1B4965"
greenColor = "#6D5CE7"
greenBackgroundColor = "#EEEBFF"
greenTextColor = "#4738B8"
yellowColor = "#D49A35"
orangeColor = "#C9782C"
orangeBackgroundColor = "#F8E9D8"
orangeTextColor = "#8F4D16"
redColor = "#C45B45"
redBackgroundColor = "#F7E2DE"
redTextColor = "#8F3A2B"
grayColor = "#61747E"

[theme.sidebar]
backgroundColor = "#1C1833"
secondaryBackgroundColor = "#272341"
textColor = "#F2F8F9"
primaryColor = "#A99DF4"
borderColor = "#3B365A"

[server]
headless = true
