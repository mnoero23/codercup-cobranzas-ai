name: Calidad Coder Cup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///data/envaplast.db
      ENVAPLAST_SEED: "20260720"
      ENVAPLAST_ENV: test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Formato y lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Inicializar datos de demostración
        run: python scripts/init_db.py --months 18
      - name: Calidad de datos
        run: python scripts/validate_data.py
      - name: Smoke test de Streamlit
        run: python scripts/smoke_app.py
